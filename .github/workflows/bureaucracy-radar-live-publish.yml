name: Bureaucracy Radar Live Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

jobs:
  publish-live-results:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bureaucracy-radar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher and build live JSON
        env:
          PYTHONPATH: src
        run: |
          python -m bureaucracy_radar.cli init-db
          python -m bureaucracy_radar.cli run --config config/sources.example.yml > data/latest-run.json
          python -m bureaucracy_radar.render_live_alerts

      - name: Commit published results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bureaucracy-radar/data/latest-run.json bureaucracy-radar/data/live-alerts.json bureaucracy-radar/data/bureaucracy_radar.db || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Bureaucracy Radar live results"
            git push
          fi
