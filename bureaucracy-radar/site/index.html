<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bureaucracy Radar</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f7fb; color: #1a1d29; }

  </style>

<body>
  <header>
    <h1>Bureaucracy Radar</h1>
    <p>Monitors official public sources, stores snapshots, and turns meaningful changes into human-readable alerts.</p>
  </header>
  <main>
    <div class="card">
      <strong>MVP preview</strong>
      <p>This page reads a sample alerts file generated by the watcher pipeline scaffold.</p>
    </div>
    <div id="alerts"></div>
  </main>
  <script src="./app.js"></script>
